<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIBot Framework</title>
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b0d12">
  <script>
    // Theme bootstrap: stamp the stored choice before CSS paints so a reload
    // never flashes the wrong theme. Same key as web/ui/theme.js (THEME_KEY).
    (function () {
      try {
        var t = localStorage.getItem('aibot.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div id="layout">
    <header id="topbar">
      <button type="button" id="nav-toggle" class="icon-btn" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">☰</button>
      <div class="logo">AIBot</div>
      <div class="nav-status" id="topbar-status">--</div>
    </header>
    <div id="drawer-backdrop"></div>
    <nav id="sidebar">
      <div class="logo">AIBot</div>
      <!-- Seven areas, rendered by app.js from web/nav-routes.js (visibility rules included) -->
      <div id="nav-areas" class="nav-areas"></div>
      <div class="nav-spacer"></div>
      <div class="nav-foot">
        <button type="button" class="palette-hint" data-palette-open aria-label="Open the command palette (Ctrl+K)"><span>Search / jump</span><kbd>⌘K</kbd></button>
        <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch theme">☼ Light</button>
        <div class="nav-status" id="nav-status">--</div>
      </div>
    </nav>
    <main id="content">
      <div id="area-nav"></div>
      <div id="page"></div>
    </main>
  </div>
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal" class="modal"></div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
